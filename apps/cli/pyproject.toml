[project]
name = "devdeploy-cli"
version = "0.1.0"
description = "Minimal DevDeploy CLI (login via API key, deploy)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
devdeploy = "devdeploy_cli.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "devdeploy_cli"
module-root = "src"
