[project]
name = "devdeploy-api"
version = "0.1.0"
description = "DevDeploy control-plane API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "phonenumbers>=9.0.41",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.10.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "devdeploy_api"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
