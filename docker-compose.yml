services:
  postgres:
    image: postgres:16-alpine
    container_name: devdeploy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devdeploy
      POSTGRES_PASSWORD: devdeploy
      POSTGRES_DB: devdeploy
    ports:
      - "5432:5432"
    volumes:
      - devdeploy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdeploy -d devdeploy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: devdeploy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  devdeploy_pgdata:
